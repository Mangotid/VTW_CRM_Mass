; All programs run as the unprivileged "viber" user (container USER).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:dbus]
command=dbus-daemon --session --nofork --nopidfile --address=unix:path=/tmp/dbus-session
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
command=Xvfb :0 -screen 0 %(ENV_SCREEN_GEOMETRY)s -nolisten tcp -ac
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=fluxbox
priority=30
startsecs=3
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; VNC only on localhost inside the container; exposed via noVNC (websockify) below.
[program:x11vnc]
command=x11vnc -display :0 -forever -shared -localhost -rfbport 5900 -rfbauth /tmp/vnc/passwd -noxdamage -quiet
priority=40
startsecs=3
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=50
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; Viber output may include chat data: never forward it to logs.
; Accessibility bus. Qt only attaches if org.a11y.Bus exists when the app starts (it does not activate it).
[program:atspi]
command=/usr/libexec/at-spi-bus-launcher --launch-immediately
priority=15
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:viber]
; Viber decides at startup whether AT-SPI and desktop notifications exist, and never re-checks.
; Wait (max 30 s each) for the a11y bus and for the bridge's notification server (incoming messages).
command=bash -c 'has() { dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:$1 2>/dev/null | grep -q true; }; for n in org.a11y.Bus org.freedesktop.Notifications; do for _ in $(seq 60); do has $n && break; sleep 0.5; done; done; exec /opt/viber/Viber'
environment=QT_LINUX_ACCESSIBILITY_ALWAYS_ON="1",QT_ACCESSIBILITY="1"
priority=60
startsecs=10
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:bridge]
command=/opt/bridge/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8101 --no-access-log --log-level warning
directory=/opt/bridge
priority=70
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
